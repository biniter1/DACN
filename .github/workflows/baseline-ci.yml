name: Baseline CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 492462084314.dkr.ecr.ap-southeast-1.amazonaws.com

permissions:
  contents: read
  security-events: write
  pull-requests: write
  # BASELINE: id-token không cần vì dùng long-lived key
  # id-token: write  ← chỉ Zero Trust mới cần

jobs:
  # ── 1. SECRET SCAN (NON-BLOCKING) ────────────────────────
  # Gitleaks chạy nhưng KHÔNG phải required status check
  # → PR vẫn merge được dù job này ❌
  secret-scan:
    name: Secret Scan (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # BASELINE: continue-on-error = true → không block merge
        continue-on-error: true

  # ── 2. BUILD & PUSH ECR ──────────────────────────────────
  # Dùng long-lived AWS credentials lưu trong GitHub Secrets
  # Không có: Trivy scan, Cosign signing, SBOM
  docker-build:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: src/frontend
          - service: cartservice
            context: src/cartservice/src
          - service: productcatalogservice
            context: src/productcatalogservice
          - service: currencyservice
            context: src/currencyservice
          - service: paymentservice
            context: src/paymentservice
          - service: shippingservice
            context: src/shippingservice
          - service: emailservice
            context: src/emailservice
          - service: checkoutservice
            context: src/checkoutservice
          - service: recommendationservice
            context: src/recommendationservice
          - service: adservice
            context: src/adservice

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # BASELINE: Long-lived AWS key lưu trong Secrets
      # Nếu key bị lộ → attacker dùng được mãi mãi (không TTL)
      # (Zero Trust: OIDC role, TTL 15 phút)
      - name: Configure AWS credentials (long-lived key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/online-boutique/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/online-boutique/${{ matrix.service }}:${{ github.sha }}

      # BASELINE: Không có các bước sau (comment out để đối chiếu)
      # - name: Trivy image scan (ENFORCE)   ← chỉ Zero Trust
      # - name: Cosign sign image            ← chỉ Zero Trust
      # - name: Generate SBOM                ← chỉ Zero Trust
      # - name: Attest SLSA provenance       ← chỉ Zero Trust

  # ── 3. DEPLOY ────────────────────────────────────────────
  deploy:
    name: Deploy to EKS (baseline)
    needs: [docker-build]
    runs-on: ubuntu-latest
    environment: baseline   # manual approval nếu cần, nhưng không strict
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (long-lived key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name dacn-cluster \
            --region ${{ env.AWS_REGION }}

      - name: Create namespace
        run: |
          kubectl apply -f k8s/manifests/namespace.yaml

      - name: Create ECR pull secret
        run: |
          kubectl create secret docker-registry ecr-secret \
            --docker-server=${{ env.ECR_REGISTRY }} \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }}) \
            --namespace boutique-baseline \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/manifests/rbac-baseline.yaml
          kubectl apply -f k8s/manifests/secrets-baseline.yaml

      # BASELINE: Không verify image signature trước khi deploy
      # (Zero Trust: cosign verify bắt buộc trước helm upgrade)
      - name: Helm deploy
        run: |
          helm upgrade --install boutique ./helm-chart \
            --namespace boutique-baseline \
            --values helm-chart/values-baseline.yaml \
            --set images.tag=${{ github.sha }} \
            --wait --timeout 8m

      - name: Verify pods running
        run: kubectl get pods -n boutique-baseline
